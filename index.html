<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="家庭库存与采购清单：记录存量、按消耗速度提醒补货，家人共享不重复购买。">
  <title>家庭妈妈小助手</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫙</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🫙</span>
        <div>
          <h1>家庭妈妈小助手</h1>
          <p id="hhName" class="hh-name"></p>
        </div>
      </div>
      <span id="syncBadge" class="sync" role="status"></span>
    </div>
    <nav class="tabs" id="tabs" aria-label="主导航">
      <a href="#/today" data-section="today"><span aria-hidden="true">🗓️</span>今日</a>
      <a href="#/pantry" data-section="pantry"><span aria-hidden="true">🫙</span>储藏</a>
      <a href="#/house" data-section="house"><span aria-hidden="true">🏠</span>房屋</a>
      <a href="#/shopping" data-section="shopping"><span aria-hidden="true">🛒</span>采购<b id="shopCount" class="tab-count" hidden></b></a>
      <a href="#/me" data-section="me"><span aria-hidden="true">👤</span>我的</a>
    </nav>
  </header>

  <main id="main" tabindex="-1"></main>

  <datalist id="unitList"></datalist>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- supabase-js UMD，固定版本；本地演示模式下不加载也能运行 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="units.js"></script>
  <script src="charts.js"></script>
  <script src="data.js"></script>
  <script src="data/house.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
