<body>
  <a class="skip" href="#main">跳到主要内容</a>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 40" width="30" height="38" aria-hidden="true">
          <rect x="4" y="1" width="24" height="7" rx="2" fill="currentColor"/>
          <rect x="3" y="8" width="26" height="30" rx="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <rect x="6" y="22" width="20" height="13" rx="3" fill="var(--mustard)"/>
        </svg>
        <div>
          <div class="brand-row">
            <h1 id="appTitle">爱家小助手</h1>
            <!-- 姐妹站点切换（与家庭学堂顶栏一致）：站名旁两枚小胶囊「‹ 上一个」「下一个 ›」 -->

          <p id="hhName" class="hh-name"></p>
        </div>
      </div>
      <!-- 右上角快捷切换语言：简体 / 繁體 / EN，与 设置 → 语言 同一份设置 -->

    </div>
    <nav class="tabs" id="tabs" aria-label="主导航">

      <a href="#/pantry" data-section="pantry"><span aria-hidden="true">🥫</span>储藏</a>

      <a href="#/shopping" data-section="shopping"><span aria-hidden="true">🛒</span>采购<b id="shopCount" class="tab-count" hidden></b></a>
      <a href="#/me" data-section="me"><span aria-hidden="true">👤</span>我的</a>
    </nav>

  <main id="main" tabindex="-1"></main>

  <datalist id="unitList"></datalist>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- supabase-js UMD，固定版本；本地演示模式下不加载也能运行 -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script defer src="config.js"></script>
  <script defer src="units.js"></script>
  <script defer src="charts.js"></script>
  <script defer src="data.js"></script>
  <script defer src="data/house.js"></script>
  <script defer src="data/bills.js"></script>
  <script defer src="data/deals.js"></script>
  <script defer src="data/care.js"></script>
  <script defer src="data/vehicles.js"></script>

  <!-- 启动自检：主脚本 6 秒内没有启动，就检查哪些文件缺失并显示在页面上（部署排错用） -->
  <script>
    (function () {
      var FILES = ["styles.css", "config.js", "units.js", "charts.js", "data.js", "data/house.js", "data/bills.js", "data/deals.js", "data/care.js", "data/vehicles.js",
        "js/main.js", "js/today.js", "js/ai-page.js", "js/menu.js", "js/core/util.js", "js/core/state.js", "js/core/router.js", "js/core/store.js", "js/core/logic.js", "js/core/config-check.js", "js/core/i18n.js", "js/i18n/en.js",
        "js/core/alerts.js", "js/core/hub.js", "js/settings/print.js", "js/pantry/scan.js", "js/pantry/views.js", "js/pantry/item-form.js", "js/house/views.js", "js/house/assets.js", "js/house/tasks.js", "js/house/deals.js", "js/house/property-form.js", "js/bills/logic.js", "js/bills/views.js", "js/stats/views.js", "js/settings/views.js", "js/settings/about.js", "js/core/ai.js", "js/pantry/ai.js", "js/core/categories.js", "js/core/locations.js"];
      // 部署更新检测：GitHub Pages 把每个文件缓存 10 分钟，刷新时浏览器会拿到新 index.html 却继续用缓存里的旧模块
      // （例如新导航指向的路由在旧 router.js 里不存在，就会跳回首页）。同一次部署的所有文件 Last-Modified 相同，
      // 所以用 document.lastModified 当作部署版本：和上次记录的不同，就绕过缓存重新拉取全部脚本，再刷新一次。
      (function () {
        var KEY = "hmh-deploy", ver = document.lastModified, prev = null;
        try { prev = localStorage.getItem(KEY); localStorage.setItem(KEY, ver); } catch (e) { return; }
        if (!prev || prev === ver) return;
        try { if (sessionStorage.getItem("hmh-reloaded") === ver) return; sessionStorage.setItem("hmh-reloaded", ver); } catch (e) { return; }
        console.log("[hmh] 检测到新部署（" + ver + "），正在更新缓存…");
        Promise.all(FILES.concat(["index.html"]).map(function (f) { return fetch(f, { cache: "reload" }).catch(function () { return null; }); }))
          .then(function () { location.reload(); });
      })();

      var errors = [];
      window.addEventListener("error", function (e) { if (e.message) errors.push(e.message + (e.filename ? "（" + e.filename.split("/").slice(-2).join("/") + "）" : "")); });
      window.__hmhModuleFailed = function () { setTimeout(report, 0); };
      function report() {
        if (window.__hmhBooted || document.getElementById("bootCheck")) return;
        var box = document.createElement("div");
        box.id = "bootCheck"; box.setAttribute("role", "alert");
        box.style.cssText = "max-width:720px;margin:24px auto;padding:16px 20px;border:2px solid #b42318;border-radius:12px;background:#fff;color:#1e3a32;font:14px/1.6 system-ui,sans-serif";
        box.innerHTML = "<b>页面脚本没有启动</b><div id='bootCheckBody'>正在检查文件…</div>";
        (document.getElementById("main") || document.body).appendChild(box);
        if (location.protocol === "file:") {
          document.getElementById("bootCheckBody").innerHTML = "当前是直接双击打开（file://）。浏览器不允许这种方式加载模块，请在项目目录运行 <code>python3 -m http.server 8000</code> 后访问 http://localhost:8000/ ，或使用部署后的网址。";
          return;
        }
        Promise.all(FILES.map(function (f) {
          return fetch(f, { method: "GET", cache: "no-store" }).then(function (r) { return r.ok ? null : f + "（" + r.status + "）"; }, function () { return f + "（无法访问）"; });
        })).then(function (res) {
          var missing = res.filter(Boolean), html = "";
          if (missing.length) html += "<p>以下文件在服务器上找不到，请确认上传时保留了文件夹结构：</p><ul><li>" + missing.join("</li><li>") + "</li></ul>";
          if (errors.length) html += "<p>脚本报错：</p><ul><li>" + errors.slice(0, 5).join("</li><li>") + "</li></ul>";
          if (!missing.length && !errors.length) html += "<p>文件都在，但脚本没有启动。请按 Ctrl+F5（Mac：Cmd+Shift+R）强制刷新；GitHub Pages 更新后可能需要等 1–2 分钟。</p>";
          document.getElementById("bootCheckBody").innerHTML = html;
        });
      }
      setTimeout(report, 6000);
    })();
  </script>
  <script type="module" src="js/main.js" onerror="window.__hmhModuleFailed && window.__hmhModuleFailed()"></script>
</body>
</html>
